<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>José Padel | Book a Lesson</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f4;color:#142018}.wrap{max-width:720px;margin:auto;padding:18px}.hero{background:linear-gradient(145deg,#122a1d,#1d5033);color:white;border-radius:26px;padding:26px 22px;margin-bottom:18px;box-shadow:0 14px 36px #163b2528}.brand{display:flex;align-items:center;gap:12px}.ball{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#d8ff45;font-size:25px}.hero h1{margin:12px 0 4px;font-size:30px}.hero p{margin:0;color:#d9e6dd}.tabs{display:flex;background:white;padding:5px;border-radius:15px;box-shadow:0 4px 18px #17251c12;margin-bottom:18px;position:sticky;top:8px;z-index:3}.tabs button{flex:1;border:0;background:transparent;padding:12px;border-radius:11px;font-weight:750;color:#66736a}.tabs .on{background:#183e28;color:white}.day{margin:22px 2px 10px;font-size:20px}.slot{background:white;border:1px solid #e5ebe6;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 5px 18px #17251c0b}.top{display:flex;justify-content:space-between;gap:12px}.time{font-size:22px;font-weight:850}.where{font-size:14px;color:#68756c;margin-top:4px}.badge{height:max-content;padding:6px 10px;border-radius:999px;background:#ecf9e7;color:#23652d;font-size:12px;font-weight:800}.full{background:#fcebea;color:#9b2f2a}.people{display:flex;gap:6px;margin:15px 0}.dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#d8ff45;font-size:15px}.dot.empty{background:#eef1ee;color:#aab2ac}.names{font-size:13px;color:#68756c;margin:-7px 0 13px}.book{width:100%;border:0;border-radius:13px;background:#d8ff45;color:#122319;font-weight:850;padding:13px;font-size:15px}.book:disabled{background:#e9ece9;color:#8a938d}.note{background:#eef6ef;border-radius:16px;padding:14px;margin-top:18px;font-size:13px;color:#536258}.price{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e0e8e1}.price:last-child{border:0}.adminbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.primary{border:0;border-radius:13px;background:#173f29;color:white;font-weight:800;padding:12px 15px}.danger{border:0;background:#fff0ef;color:#a53b35;border-radius:10px;padding:8px 10px}.adminslot{background:white;border-radius:18px;padding:15px;margin:10px 0;border:1px solid #e5ebe6}.adminslot h3{margin:0 0 5px}.bookingrow{display:flex;justify-content:space-between;align-items:center;background:#f5f7f5;border-radius:11px;padding:9px;margin-top:7px;font-size:13px}.modal{position:fixed;inset:0;background:#07110bbb;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:720px;border-radius:25px 25px 0 0;padding:22px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 4px}.x{float:right;border:0;background:#eef1ee;border-radius:50%;width:34px;height:34px;font-size:18px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d8dfd9;border-radius:12px;font:inherit}.times{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf4ee;border-radius:999px;padding:8px 11px;font-size:13px}.muted{color:#6d786f;font-size:13px}.success{text-align:center;padding:24px}.success .big{font-size:54px}footer{text-align:center;color:#89928c;font-size:12px;padding:28px 0}.hidden{display:none}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:25px;max-width:520px}}
</style></head><body><main class="wrap"><section class="hero"><div class="brand"><div class="ball">🎾</div><b>JOSÉ PADEL</b></div><h1>Book your next lesson.</h1><p>Choose a time that works for you. Payment is made in person.</p></section><nav class="tabs"><button id="clientTab" class="on" onclick="view('client')">Book a lesson</button><button id="adminTab" onclick="view('admin')">José Admin</button></nav><section id="client"></section><section id="admin" class="hidden"></section><footer>José Padel · Lesson booking prototype</footer></main>
<div class="modal" id="bookModal"><div class="sheet"><button class="x" onclick="closeModal('bookModal')">×</button><div id="bookBody"></div></div></div><div class="modal" id="addModal"><div class="sheet"><button class="x" onclick="closeModal('addModal')">×</button><h2>Add lesson slots</h2><p class="muted">Choose a day once, then add as many start times as you need.</p><div class="field"><label>Date</label><input type="date" id="aDate"></div><div class="field"><label>Venue</label><input id="aVenue" value="Padel Dome"></div><div class="field"><label>Court</label><input id="aCourt" value="Court 1"></div><div class="field"><label>Add a start time</label><div style="display:flex;gap:8px"><input type="time" id="aTime"><button class="primary" onclick="addTime()">Add</button></div></div><div class="times" id="timeChips"></div><button class="book" style="margin-top:18px" onclick="publish()">Publish lesson slots</button></div></div>
<script>
let slots=[],selected=null,newTimes=[];const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'});async function load(){slots=await fetch('/api/slots').then(r=>r.json());renderClient();renderAdmin()}function view(v){document.getElementById('client').classList.toggle('hidden',v!=='client');document.getElementById('admin').classList.toggle('hidden',v!=='admin');clientTab.classList.toggle('on',v==='client');adminTab.classList.toggle('on',v==='admin')}
function renderClient(){let out='<h2 style="margin:5px 2px">Available lessons</h2><p class="muted">Up to 4 players per lesson. Your price depends on final attendance.</p>',last='';for(const s of slots){if(s.date!==last){out+=`<h2 class="day">${fmt(s.date)}</h2>`;last=s.date}let n=s.bookings.length,full=n>=s.capacity;out+=`<div class="slot"><div class="top"><div><div class="time">${s.start} – ${s.end}</div><div class="where">📍 ${s.venue} · ${s.court}</div></div><span class="badge ${full?'full':''}">${full?'FULL':s.capacity-n+' space'+(s.capacity-n===1?'':'s')+' left'}</span></div><div class="people">${[0,1,2,3].map(i=>`<div class="dot ${i<n?'':'empty'}">${i<n?'🎾':'+'}</div>`).join('')}</div>${n?`<div class="names">${s.bookings.map(b=>b.name).join(' · ')}</div>`:''}<button class="book" ${full?'disabled':''} onclick="openBook(${s.id})">${full?'Lesson full':'Book a space'}</button></div>`}out+=`<div class="note"><b>Lesson prices</b><div class="price"><span>Private lesson</span><b>€100</b></div><div class="price"><span>2 players</span><b>€100 total · €50 each</b></div><div class="price"><span>3 players</span><b>€110 total · €36.67 each</b></div><div class="price"><span>4 players</span><b>€120 total · €30 each</b></div><p style="margin-bottom:0">No online payment. Pay José in person at your lesson.</p></div>`;client.innerHTML=out}
function renderAdmin(){let out=`<div class="adminbar"><div><h2 style="margin:0">Lesson manager</h2><span class="muted">Create any day and time</span></div><button class="primary" onclick="openAdd()">+ Add slots</button></div>`;for(const s of slots){out+=`<div class="adminslot"><div style="display:flex;justify-content:space-between"><div><h3>${fmt(s.date)} · ${s.start}</h3><div class="muted">${s.venue} · ${s.court} · ${s.bookings.length}/4 booked</div></div><button class="danger" onclick="delSlot(${s.id})">Delete</button></div>${s.bookings.length?s.bookings.map((b,i)=>`<div class="bookingrow"><span><b>🎾 ${b.name}</b><br>${b.phone}</span><button class="danger" onclick="removeBooking(${s.id},${i})">Remove</button></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>`}admin.innerHTML=out}
function openBook(id){selected=slots.find(s=>s.id===id);bookBody.innerHTML=`<h2>Book ${selected.start}</h2><p class="muted">${fmt(selected.date)} · ${selected.venue} · ${selected.court}</p><div class="field"><label>Your name</label><input id="bName" placeholder="e.g. Karl Holmes"></div><div class="field"><label>Mobile number</label><input id="bPhone" inputmode="tel" placeholder="e.g. 087 123 4567"></div><div class="note">Payment is made <b>in person</b>. Final price depends on the number of players attending.</div><button class="book" style="margin-top:16px" onclick="book()">Confirm my booking</button>`;bookModal.classList.add('show')}
async function book(){const r=await fetch('/api/book/'+selected.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:bName.value,phone:bPhone.value})});const j=await r.json();if(!r.ok)return alert(j.error);bookBody.innerHTML=`<div class="success"><div class="big">✅</div><h2>You're booked!</h2><p>${fmt(j.date)} at <b>${j.start}</b><br>${j.venue} · ${j.court}</p><div class="note">Payment is made in person at your lesson.</div><button class="book" style="margin-top:16px" onclick="closeModal('bookModal')">Done</button></div>`;load()}
function openAdd(){newTimes=[];timeChips.innerHTML='';aDate.value='2026-10-06';addModal.classList.add('show')}function addTime(){if(aTime.value&&!newTimes.includes(aTime.value)){newTimes.push(aTime.value);newTimes.sort();drawTimes()}aTime.value=''}function drawTimes(){timeChips.innerHTML=newTimes.map((t,i)=>`<span class="chip">${t} <b onclick="newTimes.splice(${i},1);drawTimes()" style="cursor:pointer">×</b></span>`).join('')}
async function publish(){const r=await fetch('/api/admin/slots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:aDate.value,venue:aVenue.value,court:aCourt.value,times:newTimes})});const j=await r.json();if(!r.ok)return alert(j.error);closeModal('addModal');await load();view('admin')}
async function delSlot(id){if(confirm('Delete this lesson slot?')){await fetch('/api/admin/slots/'+id,{method:'DELETE'});load()}}async function removeBooking(id,i){if(confirm('Remove this booking?')){await fetch(`/api/admin/slots/${id}/bookings/${i}`,{method:'DELETE'});load()}}function closeModal(id){document.getElementById(id).classList.remove('show')}load();
</script></body></html>
