<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>José Padel | Coach Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f6f3;color:#142018}.wrap{max-width:760px;margin:auto;padding:18px}.head{background:#14291c;color:white;border-radius:24px;padding:24px;margin-bottom:18px}.head h1{margin:4px 0}.muted{color:#6c766f;font-size:13px}.head .muted{color:#cbd5ce}.card{background:white;border:1px solid #e2e7e2;border-radius:18px;padding:16px;margin:10px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.green,.share{border:0;border-radius:12px;padding:12px 14px;font-weight:850}.primary{background:#173e28;color:white}.green{background:#d8ff45;color:#142018}.share{background:#e9f8eb;color:#176b2b}.danger{border:0;background:#fff0ef;color:#9b352f;border-radius:9px;padding:8px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #d6ddd7;border-radius:11px;font:inherit}.booking{display:flex;justify-content:space-between;align-items:center;background:#f4f6f4;padding:10px;border-radius:11px;margin-top:7px}.modal{position:fixed;inset:0;background:#07110bbb;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:600px;padding:22px;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto}.times{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3ee;padding:8px 10px;border-radius:999px;font-size:13px}.login{max-width:420px;margin:80px auto}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{background:white;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:22px;display:block}.fulltag{font-size:11px;background:#fff0ef;color:#9b352f;padding:4px 7px;border-radius:999px;font-weight:800}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}</style></head><body><main class="wrap"><div id="login" class="login"><div class="head"><div>🎾 JOSÉ PADEL</div><h1>Coach login</h1><p class="muted">Private lesson management dashboard</p></div><div class="card"><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter coach password"></div><button class="green" style="width:100%" onclick="loginNow()">Log in</button></div></div><div id="app" class="hidden"><div class="head"><div class="bar"><div><div>🎾 JOSÉ PADEL</div><h1>Lesson manager</h1><div class="muted">Manage availability and bookings</div></div><button class="green" onclick="openAdd()">+ Add slots</button></div><div class="actions" style="margin-top:16px"><button class="share" onclick="shareAll()">Share availability to WhatsApp</button><button class="primary" onclick="location.href='/'">Customer site</button></div></div><div class="stats" id="stats"></div><div id="list"></div></div></main><div class="modal" id="add"><div class="sheet"><h2>Add lesson slots</h2><p class="muted">Set the day once and add as many times as José is available.</p><div class="field"><label>Date</label><input type="date" id="date"></div><div class="field"><label>Venue</label><input id="venue" value="Padel Dome"></div><div class="field"><label>Court</label><input id="court" value="Court 1"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Duration</label><select id="duration"><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label>Spaces</label><select id="capacity"><option>4</option><option>3</option><option>2</option><option>1</option></select></div></div><div class="field"><label>Start time</label><div style="display:flex;gap:8px"><input type="time" id="time"><button class="primary" onclick="addTime()">Add</button></div></div><div class="times" id="times"></div><button class="green" style="width:100%;margin-top:18px" onclick="publish()">Publish slots</button><button style="width:100%;border:0;background:none;padding:13px" onclick="add.classList.remove('show')">Cancel</button></div></div><script>let token=sessionStorage.token||'',slots=[],newTimes=[];const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});async function loginNow(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}),j=await r.json();if(!r.ok)return alert(j.error);token=j.token;sessionStorage.token=token;start()}async function start(){const r=await fetch('/api/admin/slots',{headers:H()});if(!r.ok){login.classList.remove('hidden');app.classList.add('hidden');return}slots=await r.json();login.classList.add('hidden');app.classList.remove('hidden');render()}function render(){const bookings=slots.reduce((n,s)=>n+s.bookings.length,0),spaces=slots.reduce((n,s)=>n+s.capacity-s.bookings.length,0);stats.innerHTML=`<div class="stat"><b>${slots.length}</b><span class="muted">Slots</span></div><div class="stat"><b>${bookings}</b><span class="muted">Bookings</span></div><div class="stat"><b>${spaces}</b><span class="muted">Spaces left</span></div>`;list.innerHTML=slots.map(s=>`<div class="card"><div class="bar"><div><b>${fmt(s.date)} · ${s.start}-${s.end}</b> ${s.bookings.length>=s.capacity?'<span class="fulltag">FULL</span>':''}<div class="muted">${s.venue} · ${s.court} · ${s.bookings.length}/${s.capacity}</div></div><button class="danger" onclick="del(${s.id})">Delete</button></div>${s.bookings.map((b,i)=>`<div class="booking"><span><b>🎾 ${b.name}</b><br><span class="muted">${b.phone||'No number'}</span></span><button class="danger" onclick="removeB(${s.id},${i})">Remove</button></div>`).join('')}<div class="actions" style="margin-top:10px"><button class="primary" onclick="manual(${s.id})">+ Add player</button><button class="share" onclick="shareSlot(${s.id})">Share slot</button></div></div>`).join('')}function openAdd(){newTimes=[];times.innerHTML='';date.value=new Date().toISOString().slice(0,10);add.classList.add('show')}function addTime(){if(time.value&&!newTimes.includes(time.value)){newTimes.push(time.value);newTimes.sort();draw()}time.value=''}function draw(){times.innerHTML=newTimes.map((t,i)=>`<span class="chip">${t} <b onclick="newTimes.splice(${i},1);draw()">×</b></span>`).join('')}async function publish(){const r=await fetch('/api/admin/slots',{method:'POST',headers:H(),body:JSON.stringify({date:date.value,venue:venue.value,court:court.value,times:newTimes,duration:duration.value,capacity:capacity.value})}),j=await r.json();if(!r.ok)return alert(j.error);add.classList.remove('show');start()}async function del(id){if(confirm('Delete this lesson slot and its bookings?')){await fetch('/api/admin/slots/'+id,{method:'DELETE',headers:H()});start()}}async function removeB(id,i){if(confirm('Remove this player from the lesson?')){await fetch(`/api/admin/slots/${id}/bookings/${i}`,{method:'DELETE',headers:H()});start()}}async function manual(id){const name=prompt('Player full name');if(!name)return;const phone=prompt('Mobile number (optional)')||'';const r=await fetch(`/api/admin/slots/${id}/bookings`,{method:'POST',headers:H(),body:JSON.stringify({name,phone})}),j=await r.json();if(!r.ok)return alert(j.error);start()}function wa(text){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}function shareSlot(id){const s=slots.find(x=>x.id===id),left=s.capacity-s.bookings.length;wa(`🎾 Padel lesson with José Arrayás\n${fmt(s.date)} · ${s.start}-${s.end}\n📍 ${s.venue} · ${s.court}\n${left} space${left===1?'':'s'} available\n\nBook here: ${location.origin}`)}function shareAll(){const available=slots.filter(s=>s.bookings.length<s.capacity);if(!available.length)return alert('No available lessons to share.');const lines=available.map(s=>`• ${fmt(s.date)} · ${s.start} · ${s.capacity-s.bookings.length} space${s.capacity-s.bookings.length===1?'':'s'}`).join('\n');wa(`🎾 Padel lessons with José Arrayás\n\nAvailable sessions:\n${lines}\n\nBook your place here: ${location.origin}\nPayment in person.`)}if(token)start();</script></body></html>
