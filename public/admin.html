<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>José Padel | Coach Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f3;color:#142018}.wrap{max-width:760px;margin:auto;padding:16px}.head{background:#13291b;color:#fff;border-radius:26px;padding:24px;margin-bottom:14px}.brand{font-size:12px;font-weight:900;letter-spacing:1.4px;color:#d8ff45}.head h1{font-size:29px;margin:8px 0 4px}.muted{color:#6c766f;font-size:13px;line-height:1.45}.head .muted{color:#cbd5ce}.topbar,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{border:0;border-radius:13px;padding:13px 14px;font-weight:850;font-size:14px}.lime{background:#d8ff45;color:#142018}.dark{background:#21412c;color:#fff}.share{background:#e7f6e8;color:#176b2b}.light{background:#fff;color:#26382d;border:1px solid #dde4de}.danger{background:#fff0ef;color:#9b352f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 22px}.stat{background:#fff;border:1px solid #e5e9e5;border-radius:16px;padding:14px 8px;text-align:center}.stat b{display:block;font-size:23px}.sectiontitle{font-size:20px;margin:20px 3px 8px}.card{background:#fff;border:1px solid #e2e7e2;border-radius:19px;padding:16px;margin:9px 0;box-shadow:0 5px 16px #14201808}.time{font-size:18px;font-weight:900}.tag{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eaf7e8;color:#24662f}.tag.full{background:#fff0ef;color:#9b352f}.tag.cancelled{background:#eee;color:#666}.booking{display:flex;justify-content:space-between;align-items:center;background:#f5f7f5;padding:10px 11px;border-radius:11px;margin-top:7px}.booking b{font-size:14px}.cardactions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.cardactions .btn{padding:10px 6px;font-size:12px}.manage{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #edf0ed}.manage.show{display:block}.manage .btn{width:100%;margin-top:7px}.modal{position:fixed;inset:0;background:#07110bbb;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;padding:22px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #d6ddd7;border-radius:11px;font:inherit}.times{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3ee;padding:8px 10px;border-radius:999px;font-size:13px}.login{max-width:420px;margin:70px auto}.loginhero{background:#13291b;color:#fff;border-radius:25px;padding:28px 22px;margin-bottom:12px}.loginhero h1{margin:8px 0}.hidden{display:none}.empty{background:#fff;border:1px dashed #d4dbd5;border-radius:17px;padding:25px;text-align:center}.past{opacity:.72}.logout{border:0;background:transparent;color:#dbe5dd;font-weight:700;padding:5px}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}@media(max-width:430px){.head{padding:20px}.actions{grid-template-columns:1fr}.cardactions{grid-template-columns:1fr 1fr}.cardactions .btn:last-child{grid-column:1/-1}}</style></head><body><main class="wrap"><div id="login" class="login"><div class="loginhero"><div class="brand">🎾 JOSÉ ARRAYÁS PADEL</div><h1>Coach login</h1><p class="muted">Your private coaching dashboard.</p></div><div class="card"><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')loginNow()"></div><button class="btn lime" style="width:100%" onclick="loginNow()">Log in</button></div></div><div id="app" class="hidden"><section class="head"><div class="topbar"><div class="brand">🎾 JOSÉ ARRAYÁS PADEL</div><button class="logout" onclick="logout()">Log out</button></div><h1 id="greeting">Your coaching dashboard</h1><div class="muted">Manage upcoming lessons, players and availability.</div><div class="actions"><button class="btn lime" onclick="openAdd()">＋ Add availability</button><button class="btn share" onclick="shareAll()">Share availability</button></div></section><div class="stats" id="stats"></div><h2 class="sectiontitle">Upcoming lessons</h2><div id="upcoming"></div><h2 class="sectiontitle">Past & cancelled</h2><div id="past"></div></div></main><div class="modal" id="add"><div class="sheet"><h2>Add availability</h2><p class="muted">Choose a day, venue and court, then add all of José's available start times.</p><div class="field"><label>Date</label><input type="date" id="date"></div><div class="field"><label>Venue</label><input id="venue" value="Padel Dome"></div><div class="field"><label>Court</label><input id="court" value="Court 1"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Duration</label><select id="duration"><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label>Spaces</label><select id="capacity"><option>4</option><option>3</option><option>2</option><option>1</option></select></div></div><div class="field"><label>Start time</label><div style="display:flex;gap:8px"><input type="time" id="time"><button class="btn dark" onclick="addTime()">Add</button></div></div><div class="times" id="times"></div><button class="btn lime" style="width:100%;margin-top:18px" onclick="publish()">Publish availability</button><button class="btn light" style="width:100%;margin-top:8px" onclick="add.classList.remove('show')">Cancel</button></div></div><script>let token=localStorage.coachToken||'',slots=[],newTimes=[];const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token}),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}),today=()=>new Date().toISOString().slice(0,10);function greet(){const h=new Date().getHours();greeting.textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', José 👋'}async function loginNow(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})}),j=await r.json();if(!r.ok)return alert(j.error);token=j.token;localStorage.coachToken=token;start()}async function logout(){try{await fetch('/api/admin/logout',{method:'POST',headers:H()})}catch(e){}localStorage.removeItem('coachToken');token='';location.reload()}async function start(){const r=await fetch('/api/admin/slots',{headers:H()});if(!r.ok){localStorage.removeItem('coachToken');login.classList.remove('hidden');app.classList.add('hidden');return}slots=await r.json();login.classList.add('hidden');app.classList.remove('hidden');greet();render()}function render(){const future=slots.filter(s=>s.status==='active'&&s.date>=today()),old=slots.filter(s=>s.status!=='active'||s.date<today()),bookings=future.reduce((n,s)=>n+s.bookings.length,0),spaces=future.reduce((n,s)=>n+s.capacity-s.bookings.length,0);stats.innerHTML=`<div class="stat"><b>${future.length}</b><span class="muted">Sessions</span></div><div class="stat"><b>${bookings}</b><span class="muted">Players</span></div><div class="stat"><b>${spaces}</b><span class="muted">Spaces</span></div>`;upcoming.innerHTML=future.length?future.map(card).join(''):'<div class="empty"><b>No upcoming lessons</b><p class="muted">Tap Add availability to publish José’s next sessions.</p></div>';past.innerHTML=old.length?old.slice().reverse().map(s=>card(s,true)).join(''):'<div class="empty"><span class="muted">Past and cancelled lessons will appear here.</span></div>'}function card(s,isPast=false){const full=s.bookings.length>=s.capacity,cancelled=s.status==='cancelled';return `<div class="card ${isPast?'past':''}"><div class="row"><div><div class="time">${fmt(s.date)} · ${s.start}-${s.end}</div><div class="muted">${s.venue} · ${s.court} · ${s.bookings.length}/${s.capacity} booked</div></div><span class="tag ${cancelled?'cancelled':full?'full':''}">${cancelled?'CANCELLED':full?'FULL':s.capacity-s.bookings.length+' LEFT'}</span></div>${s.bookings.map((b,i)=>`<div class="booking"><span><b>🎾 ${b.name}</b><br><span class="muted">${b.phone||'No number'}</span></span>${!cancelled&&!isPast?`<button class="btn light" onclick="removeB(${s.id},${i})">Remove</button>`:''}</div>`).join('')}${!isPast&&!cancelled?`<div class="cardactions"><button class="btn dark" onclick="manual(${s.id})">＋ Player</button><button class="btn share" onclick="shareSlot(${s.id})">Share</button><button class="btn light" onclick="toggleManage(${s.id})">Manage</button></div><div class="manage" id="m${s.id}"><button class="btn danger" onclick="cancelLesson(${s.id})">Cancel entire lesson</button></div>`:''}</div>`}function toggleManage(id){document.getElementById('m'+id).classList.toggle('show')}function openAdd(){newTimes=[];times.innerHTML='';date.value=today();add.classList.add('show')}function addTime(){if(time.value&&!newTimes.includes(time.value)){newTimes.push(time.value);newTimes.sort();draw()}time.value=''}function draw(){times.innerHTML=newTimes.map((t,i)=>`<span class="chip">${t} <b onclick="newTimes.splice(${i},1);draw()">×</b></span>`).join('')}async function publish(){const r=await fetch('/api/admin/slots',{method:'POST',headers:H(),body:JSON.stringify({date:date.value,venue:venue.value,court:court.value,times:newTimes,duration:duration.value,capacity:capacity.value})}),j=await r.json();if(!r.ok)return alert(j.error);add.classList.remove('show');start()}async function cancelLesson(id){const s=slots.find(x=>x.id===id),names=s.bookings.map(b=>b.name+(b.phone?' · '+b.phone:'')).join('\n');if(!confirm(`Cancel this entire lesson?\n\n${s.bookings.length?`Players to contact:\n${names}\n\n`:''}It will be removed from public availability but kept in your dashboard.`))return;const r=await fetch(`/api/admin/slots/${id}/cancel`,{method:'POST',headers:H()}),j=await r.json();if(!r.ok)return alert(j.error);start()}async function removeB(id,i){if(confirm('Remove this player from the lesson?')){await fetch(`/api/admin/slots/${id}/bookings/${i}`,{method:'DELETE',headers:H()});start()}}async function manual(id){const name=prompt('Player full name');if(!name)return;const phone=prompt('Mobile number (optional)')||'';const r=await fetch(`/api/admin/slots/${id}/bookings`,{method:'POST',headers:H(),body:JSON.stringify({name,phone})}),j=await r.json();if(!r.ok)return alert(j.error);start()}function wa(text){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}function shareSlot(id){const s=slots.find(x=>x.id===id),left=s.capacity-s.bookings.length;wa(`🎾 Padel lesson with José Arrayás\n${fmt(s.date)} · ${s.start}-${s.end}\n📍 ${s.venue} · ${s.court}\n${left} space${left===1?'':'s'} available\n\nBook here: ${location.origin}`)}function shareAll(){const available=slots.filter(s=>s.status==='active'&&s.date>=today()&&s.bookings.length<s.capacity);if(!available.length)return alert('No available lessons to share.');const lines=available.map(s=>`• ${fmt(s.date)} · ${s.start} · ${s.capacity-s.bookings.length} space${s.capacity-s.bookings.length===1?'':'s'}`).join('\n');wa(`🎾 Padel lessons with José Arrayás\n\nAvailable sessions:\n${lines}\n\nBook your place here: ${location.origin}\nPayment in person.`)}if(token)start();</script></body></html>
